<header class="bar" [class.is-stuck]="scrolled">
  <a routerLink="/" class="brand" aria-label="CouturiX, accueil">
    <img src="logo-couturix.png" alt="">
  </a>
  <button type="button" class="burger" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Menu">
    <mat-icon>{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>
  <div class="bar-links" [class.open]="menuOpen">
    <nav>
      @for (item of headerMenus(); track item.id) {
        @if (parts(item.path).href) {
          <a [href]="parts(item.path).href" target="_blank" rel="noopener" (click)="menuOpen = false">{{ item.label }}</a>
        } @else {
          <a [routerLink]="parts(item.path).link" [fragment]="parts(item.path).fragment"
             routerLinkActive="is-on" [routerLinkActiveOptions]="{ exact: parts(item.path).link === '/' }"
             (click)="menuOpen = false">{{ item.label }}</a>
        }
      }
    </nav>
    <div class="bar-actions">
      <button type="button" class="icon-btn" (click)="focusSearch()" aria-label="Rechercher">
        <mat-icon>search</mat-icon>
      </button>
      @if (auth.isAuthenticated()) {
        <a class="btn btn-pink" [routerLink]="auth.homeAfterLogin()" (click)="menuOpen = false">Mon espace</a>
      } @else {
        <button type="button" class="text-btn" (click)="openClient()">Compte client</button>
        <a routerLink="/login" class="btn btn-line" routerLinkActive="is-on" (click)="menuOpen = false">Connexion</a>
        @if (cta().href) {
          <a class="btn btn-pink" [href]="cta().href" target="_blank" rel="noopener" (click)="menuOpen = false">{{ ctaLabel() }}</a>
        } @else {
          <a class="btn btn-pink" [routerLink]="cta().link" [fragment]="cta().fragment" routerLinkActive="is-on" (click)="menuOpen = false">{{ ctaLabel() }}</a>
        }
      }
    </div>
  </div>
</header>
